plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.arabi.ytdownloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.arabi.ytdownloader"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        // تقليل حجم APK بدعم فقط ARM64 و ARMv7
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // فقط yt-dlp (بدون ffmpeg لتقليل الحجم)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.16.0'
}
